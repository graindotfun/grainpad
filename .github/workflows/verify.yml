name: Public core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run verify:public
      - run: npm run build
      - name: Scan exact published tree and all fetched history
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/gitleaks-bin" "$RUNNER_TEMP/public-tree"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-tree"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$RUNNER_TEMP/public-tree" --ignore-gitleaks-allow --redact
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="--all" --ignore-gitleaks-allow --redact
